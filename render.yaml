services:
  - type: web
    plan: free
    runtime: image
    name: n8n-service
    image:
      url: docker.io/n8nio/n8n:latest

    envVars:
      - key: N8N_ENCRYPTION_KEY
        sync: false

      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_DATABASE
        value: postgres              # Supabase default DB name
      - key: DB_POSTGRESDB_HOST
        value: aws-1-ap-south-1.pooler.supabase.com   # ← your Supabase  host
      - key: DB_POSTGRESDB_PORT
        value: 5432
      - key: DB_POSTGRESDB_USER
        value: postgres.dtopjfzoiluhhxpwvckd              # Supabase default user
      - key: DB_POSTGRESDB_PASSWORD
        sync: false        # ← your Supabase DB password
      - key: DB_POSTGRESDB_SSL
        value: true 
      - key: EXECUTIONS_DATA_PRUNE
        value: true
      - key: EXECUTIONS_DATA_MAX_AGE     
        value: 72                   #max esecution history 3days in hours
      - key: EXECUTIONS_DATA_PRUNE_MAX_COUNT
        value: 1000          #max esecutions
      - key: N8N_RUNNERS_ENABLED
        value: false
        

