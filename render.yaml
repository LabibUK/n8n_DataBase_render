services:
  - type: web
    plan: free
    runtime: image
    name: n8n-service
    image:
      url: docker.io/n8nio/n8n:latest

    envVars:
      - key: N8N_ENCRYPTION_KEY
        sync: false

      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_DATABASE
        value: postgres              # Supabase default DB name
      - key: DB_POSTGRESDB_HOST
        value: db.dtopjfzoiluhhxpwvckd.supabase.co   # ← your Supabase  host
      - key: DB_POSTGRESDB_PORT
        value: 5432
      - key: DB_POSTGRESDB_USER
        value: postgres              # Supabase default user
      - key: DB_POSTGRESDB_PASSWORD
        sync: false        # ← your Supabase DB password
      - key: DB_POSTGRESDB_SSL
        value: true                  # Required for Supabase

# databases: section removed entirely
